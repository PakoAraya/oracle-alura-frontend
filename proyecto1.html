<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidebar</title>
  <link rel="stylesheet" href="assets/css/proyecto1.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>
<body>
  <!-- Proyecto de Sidebar -->
  <aside class="sidebar">
    <form class="sidebar__form" action="">
      <input type="checkbox" id="open-menu" >
      <label for="open-menu" class="material-symbols-outlined">close</label>
      <label for="open-menu" class="material-symbols-outlined open-button">double_arrow</label>
    </form>
    <picture class="sidebar__picture">
      <source srcset="/assets/img/favicon.png" media="(max-width: 57.5rem)">
      <img src="/assets/img/favicon2.png" alt="logo">
    </picture>
    <nav class="sidebar__nav">
      <ul>
        <li class="sidebar__item">
          <span class="material-symbols-outlined">Notifications</span>
          <a href="#">Notifications</a>
        </li>
        <li class="sidebar__item">
          <span class="material-symbols-outlined">mark_email_unread</span>
          <a href="#">Messages</a>
        </li>
        <li class="sidebar__item">
          <span class="material-symbols-outlined">Shopping_cart</span>
          <a href="#">Cart</a>
        </li>
        <li class="sidebar__item">
          <span class="material-symbols-outlined">account_balance</span>
          <a href="#">Balance</a>
        </li>
        <li class="sidebar__item">
          <span class="material-symbols-outlined">Settings</span>
          <a href="#">Settings</a>
        </li>
      </ul>
    </nav>
    <div class="sidebar__profile">
      <ul>
        <li class="sidebar__item item--profile">
          <img src="/assets/img/pako2.jpeg" alt="avatar">
          <span class="profile-option">PROFILE</span>
        </li>
        <li class="sidebar__item">
          <span class="material-symbols-outlined">Logout</span>
          <a href="#">Logout</a>
        </li>
      </ul>
    </div>
  </aside>
</body>
</html>
