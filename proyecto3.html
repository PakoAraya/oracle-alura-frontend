<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flip Card</title>
  <link rel="stylesheet" href="assets/css/proyecto3.css">
</head>
<body>
  <div class="card">
    <!-- Card Front -->
    <div class="card__front">
      <picture class="card__worker">
        <source srcset="assets/img/pako2.jpeg" media="(max-width: 600px)" >
        <img src="assets/img/pako.png" alt="Worker">
      </picture>
      <div class="card__data">
        <span>PaKo Araya</span>
        <p>
          Lorem, ipsum dolor sit amet consectetur adipisicing elit. Libero officia placeat distinctio et, aliquid consequuntur aspernatur ducimus dignissimos labore perferendis eum consectetur voluptatibus, esse ullam debitis ea inventore ipsam possimus.
        </p>
      </div>
    </div>
    <!-- Card Back -->
    <div class="card__back">
        <span>SKILLS</span>
        <div class="skills-bar">
          <div class="html">HTML</div>
        </div>
        <div class="skills-bar">
          <div class="css">CSS</div>
        </div>
        <div class="skills-bar">
          <div class="js">JavaScript</div>
        </div>
        <div class="skills-bar">
          <div class="java">Java</div>
        </div>
        <div class="skills-bar">
          <div class="sql">SQL</div>
        </div>
    </div>
  </div>
</body>
</html>
